<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6E7E4">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:image" content="https://bellafru.no/og-image.png">
<meta name="twitter:image" content="https://bellafru.no/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<title>Siden finnes ikke — Bellafru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6E7E4;--ink:#141414;--muted:#6B5A5E;--mauve:#B07A8C;--gold:#C9A96E;
  --line:rgba(176,122,140,.28);--on-accent:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:Jost,system-ui,sans-serif;line-height:1.55;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;
  background-image:
    radial-gradient(ellipse 90% 55% at 10% -10%,rgba(201,169,110,.2),transparent 55%),
    radial-gradient(ellipse 70% 45% at 100% 0%,rgba(176,122,140,.16),transparent 50%);
}
main{width:100%;max-width:36rem}
.brand{
  font-family:"Playfair Display",Georgia,serif;font-size:1.35rem;font-weight:600;
  letter-spacing:.12em;margin:0;color:var(--ink);text-decoration:none;
}
.rubro{margin:.35rem 0 0;color:var(--muted);font-size:.95rem}
.code{
  font-family:"Playfair Display",Georgia,serif;
  font-size:clamp(4.5rem,18vw,7rem);line-height:1;font-weight:600;
  color:var(--mauve);margin:2rem 0 .5rem;
}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;margin:0 0 .5rem;font-size:1.8rem}
p{margin:0 0 1rem}
.actions{margin-top:1.75rem;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem}
.btn{
  display:inline-block;background:var(--ink);color:var(--on-accent);text-decoration:none;
  padding:.8rem 1.4rem;font-weight:600;text-align:center;
}
.btn:hover,.btn:focus-visible{background:var(--mauve)}
.actions a:not(.btn){color:var(--mauve);text-underline-offset:3px}
.actions a:not(.btn):hover{color:var(--ink)}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.contact{color:var(--muted);font-size:.95rem}
@media (max-width:480px){.actions{flex-direction:column;align-items:stretch}.btn{width:100%}}
</style>
<meta name="twitter:title" content="Siden finnes ikke — Bellafru">
</head>
<body>
<main>
<a class="brand" href="/">Bellafru</a>
<p class="rubro">Din daglige luksus</p>
<div class="code" aria-hidden="true">404</div>
<h1>Siden finnes ikke</h1>
<p>Vi finner ikke denne siden hos Bellafru. Den kan være flyttet, eller adressen kan være skrevet feil.</p>
<div class="actions">
<a class="btn" href="/">Til forsiden</a>
<a href="/#shop">Katalogen</a>
<span class="contact">Kontakt: <a href="mailto:kontakt@bellafru.no">kontakt@bellafru.no</a></span>
</div>
</main>
</body>
</html>
